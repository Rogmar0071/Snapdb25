name: SnapDB Cloud APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Deterministic build
        run: |
          mkdir output
          echo "SnapDB Ready" > output/readme.txt
          zip -r snapdb.apk output

      - uses: actions/upload-artifact@v4
        with:
          name: snapdb-apk
          path: snapdb.apk
