name: snapdb-cloud-build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate minimal deterministic project
        run: |
          mkdir -p app/src/main/java/com/snapdb
          mkdir -p app/src/main/res/values

          cat > settings.gradle << 'EOF'
          rootProject.name = "snapdb"
          include ':app'
          EOF

          cat > build.gradle << 'EOF'
          buildscript {
              repositories { google(); mavenCentral() }
              dependencies {
                  classpath 'com.android.tools.build:gradle:8.2.2'
              }
          }
          allprojects { repositories { google(); mavenCentral() } }
          EOF

          cat > gradlew << 'EOF'
          #!/usr/bin/env bash
          gradle "$@"
          EOF
          chmod +x gradlew

          cat > app/build.gradle << 'EOF'
          plugins { id 'com.android.application' }

          android {
              namespace "com.snapdb"
              compileSdk 34

              defaultConfig {
                  applicationId "com.snapdb"
                  minSdk 24
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release { minifyEnabled false }
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml << 'EOF'
          <manifest package="com.snapdb">
            <application
                android:label="SnapDB"
                android:allowBackup="true">
              <activity android:name=".MainActivity">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/snapdb/MainActivity.java << 'EOF'
          package com.snapdb;
          import android.app.Activity;
          import android.os.Bundle;
          import android.widget.TextView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle b) {
                  super.onCreate(b);
                  TextView tv = new TextView(this);
                  tv.setText("SnapDB Ready");
                  setContentView(tv);
              }
          }
          EOF

      - name: Build APK
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: snapdb-apk
          path: app/build/outputs/apk/release/*.apk
